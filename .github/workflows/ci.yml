name: CAP validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CAP dependencies
        run: npm install
      - name: Install application router dependencies
        run: npm install --prefix approuter
      - name: Run automated tests
        run: npm test
      - name: Build CAP for production
        run: npm run build
