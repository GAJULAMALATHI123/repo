specVersion: "3.0"
metadata:
  name: itam-assets
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.fe.templates
    - name: sap.fe.core
    - name: sap.m
    - name: sap.ui.core
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /odata
            url: http://localhost:4004
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
